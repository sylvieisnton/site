services:
    site:
        container_name: site
        image: sylvieisnton/site:latest
        pull_policy: always
        restart: unless-stopped
        labels:
            - com.centurylinklabs.watchtower.enable=true
        ports:
            - "3000:3000"
        volumes:
            - ./config:/config:ro
        env_file: .env
        cap_drop: [ALL]
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp

    caddy:
        container_name: caddy
        image: caddy:2
        restart: unless-stopped
        depends_on:
            - site
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config

    watchtower:
        container_name: watchtower
        image: nickfedor/watchtower:latest
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - WATCHTOWER_LABEL_ENABLE=true
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_POLL_INTERVAL=300

volumes:
    caddy_data:
    caddy_config:
