services:
    site:
        image: sylvieisnton/site:latest
        build: .
        restart: unless-stopped
        ports:
            - "3000:3000"
        volumes:
            - ./config:/config:ro
        env_file: .env
        cap_drop: [ALL]
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp

    caddy:
        image: caddy:2
        restart: unless-stopped
        depends_on:
            - site
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config

volumes:
    caddy_data:
    caddy_config: