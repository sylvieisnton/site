<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="My projects" />
	<title>projects</title>
	<link rel="icon" href="" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap" />
	<link rel="stylesheet" href="./styles.css" />
</head>

<body class="intro">
	<div class="intro-overlay" aria-hidden="true">
		<span class="intro-text" id="intro-text"></span>
	</div>
	<div class="page">
		<header class="box header">
			<div>
				<p class="meta">
					<span id="host"></span>
					<span id="commit"></span>
				</p>
				<h1 class="title"><span class="accent" id="name-username"></span><span class="muted">/projects</span></h1>
				<p class="tagline" id="tagline"></p>
			</div>
			<div class="links">
				<nav class="nav">
					<a class="btn" href="/">home</a>
					<a class="btn active" href="/projects" aria-current="page">projects</a>
				</nav>
				<ul class="socials" id="socials"></ul>
			</div>
		</header>

		<main class="projects-page">
			<section class="box">
				<h2 class="box-title">My repos <a class="gh-link small" id="gh-link" href="#" target="_blank" rel="noopener"></a></h2>
				<div class="repos" id="repo-list">
					<p class="muted small">loading...</p>
				</div>
			</section>

			<section class="box">
				<h2 class="box-title">Recently contributed to</h2>
				<div class="repos" id="contrib-list">
					<p class="muted small">loading...</p>
				</div>
			</section>
		</main>
	</div>

	<script type="module" src="./projects.ts"></script>
</body>

</html>
